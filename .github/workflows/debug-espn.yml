name: Debug ESPN summary (temporário)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inspeciona summary da ESPN
        run: node scripts/debug-espn-summary.mjs 760425
