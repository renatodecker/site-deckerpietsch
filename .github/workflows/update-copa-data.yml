name: Atualizar dados da Copa 2026

on:
  schedule:
    # A cada 30 min. O script decide se vale a pena buscar dados (verifica se
    # estamos dentro do período do torneio) antes de chamar a ESPN.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-copa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executa script de atualização
        run: node scripts/update-copa-data.mjs

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add copa/data/
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore: atualiza dados da Copa 2026"
            git push
          fi
