name: Atualizar dados da Copa 2026

on:
  schedule:
    # A cada 30 min. O script decide se vale a pena chamar a API
    # (orçamento diário do plano free da API-Football), então a maioria
    # dessas execuções não consome nenhuma requisição.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de execução'
        required: false
        default: 'update'
        type: choice
        options:
          - update
          - discover
          - bootstrap-teams

permissions:
  contents: write

concurrency:
  group: update-copa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executa script de atualização
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MODE: ${{ github.event.inputs.mode || 'update' }}
        run: |
          case "$MODE" in
            discover) node scripts/update-copa-data.mjs --discover ;;
            bootstrap-teams) node scripts/update-copa-data.mjs --bootstrap-teams ;;
            *) node scripts/update-copa-data.mjs ;;
          esac

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add copa/data/
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore: atualiza dados da Copa 2026"
            git push
          fi
