<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Taça da Copa do Mundo">
  <defs>
    <linearGradient id="goldBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="45%" stop-color="#ffdf00" />
      <stop offset="100%" stop-color="#b38600" />
    </linearGradient>
    <linearGradient id="goldBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af00" />
      <stop offset="100%" stop-color="#8a6d00" />
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="55" y="216" width="90" height="14" rx="3" fill="url(#goldBase)" />
  <rect x="68" y="200" width="64" height="18" rx="3" fill="url(#goldBase)" />

  <!-- stem -->
  <path d="M92 200 L92 168 L108 168 L108 200 Z" fill="url(#goldBody)" />

  <!-- cup bands spiralling up to the globe -->
  <path d="M100 168
           C58 168 40 140 46 110
           C50 90 64 78 78 70
           C66 64 60 50 66 36
           C72 22 88 14 100 14
           C112 14 128 22 134 36
           C140 50 134 64 122 70
           C136 78 150 90 154 110
           C160 140 142 168 100 168 Z"
        fill="none" stroke="url(#goldBody)" stroke-width="14" stroke-linecap="round" />

  <!-- globe on top -->
  <circle cx="100" cy="40" r="26" fill="url(#goldBody)" />
  <g stroke="#8a6d00" stroke-width="2" fill="none" opacity="0.55">
    <ellipse cx="100" cy="40" rx="26" ry="11" />
    <ellipse cx="100" cy="40" rx="11" ry="26" />
    <line x1="74" y1="40" x2="126" y2="40" />
  </g>

  <!-- shine -->
  <path d="M84 28 C90 22 98 20 106 22" stroke="#fff8d9" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85" />
</svg>
