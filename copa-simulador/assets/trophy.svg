<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Taça da Copa do Mundo">
  <defs>
    <linearGradient id="goldBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="45%" stop-color="#ffdf00" />
      <stop offset="100%" stop-color="#b38600" />
    </linearGradient>
    <linearGradient id="goldBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af00" />
      <stop offset="100%" stop-color="#8a6d00" />
    </linearGradient>
  </defs>

  <!-- handles -->
  <path d="M62 52 C 26 52 24 92 58 100" fill="none" stroke="url(#goldBody)" stroke-width="11" stroke-linecap="round" />
  <path d="M138 52 C 174 52 176 92 142 100" fill="none" stroke="url(#goldBody)" stroke-width="11" stroke-linecap="round" />

  <!-- cup bowl -->
  <path d="M58 30
           A 42 10 0 0 1 142 30
           C 142 78 124 116 100 148
           C 76 116 58 78 58 30 Z"
        fill="url(#goldBody)" />

  <!-- rim highlight -->
  <ellipse cx="100" cy="29" rx="40" ry="8" fill="#fff8d9" opacity="0.6" />

  <!-- star -->
  <path d="M100 54 L106 68 L121 69 L109 79 L113 94 L100 85 L87 94 L91 79 L79 69 L94 68 Z"
        fill="#8a6d00" opacity="0.65" />

  <!-- stem -->
  <path d="M90 148 L110 148 L106 184 L94 184 Z" fill="url(#goldBody)" />

  <!-- base -->
  <rect x="74" y="184" width="52" height="14" rx="3" fill="url(#goldBase)" />
  <rect x="60" y="200" width="80" height="16" rx="3" fill="url(#goldBase)" />
</svg>
